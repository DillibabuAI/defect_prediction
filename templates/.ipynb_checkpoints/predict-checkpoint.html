
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Defects</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="brand">DefectPredict</div>
        <a href="{{ url_for('home') }}">Home</a>
    </nav>

    <main class="container">
        <div class="heading">
            <span class="tag">PREDICTION MODULE</span>
            <h1>Enter Software Metrics</h1>
            <p>Provide values for all ten model features.</p>
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('predict') }}" method="POST">
            <div class="form-grid">
                {% for feature in features %}
                    <div class="form-group">
                        <label for="{{ feature }}">
                            {{ feature }}
                        </label>
                        <input
                            type="number"
                            id="{{ feature }}"
                            name="{{ feature }}"
                            step="any"
                            min="0"
                            value="{{ request.form.get(feature, '') }}"
                            required
                        >
                    </div>
                {% endfor %}
            </div>

            <button class="btn submit-btn" type="submit">
                Predict Defect Status →
            </button>
        </form>

        <a class="back-link" href="{{ url_for('home') }}">
            ← Back to Home
        </a>
    </main>
</body>
</html>
